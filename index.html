<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Pro Task Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Bad+Script&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main-container">
        <section id="input-section">
            <h1 id="header">Task Manager</h1>
            <div class="input-group">
                <input id="taskInput" type="text" placeholder="What needs to be done?">
                <button id="addBtn" type="button">Add</button>
            </div>
        </section>

        <section id="output-section">
            <div id="empty-state">
                <p>No tasks yet... Start your day by adding one!</p>
            </div>
            <ul id="taskList"></ul>
        </section>
    </div>
    <script src="script.js" charset="utf-8"></script>
</body>
</html>
